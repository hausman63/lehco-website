name: Weekly email
# Sunday 9 AM Eastern (winter): build "The week in Lehigh County" and hand it to Kit to send.
on:
  schedule:
    - cron: '0 14 * * 0'
  workflow_dispatch:
    inputs:
      mode:
        description: 'draft = save a draft in Kit, send = send to subscribers in 15 minutes'
        required: true
        default: 'draft'
        type: choice
        options: [draft, send]
permissions:
  contents: write
concurrency:
  group: weekly-email
  cancel-in-progress: false
jobs:
  email:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add newly published videos
        run: python3 _build/update_from_youtube.py
      - name: Build this week's issue
        run: python3 _build/build_newsletter.py
      - name: Hand it to Kit
        env:
          KIT_API_KEY: ${{ secrets.KIT_API_KEY }}
          MODE: ${{ github.event_name == 'schedule' && 'send' || inputs.mode }}
        run: python3 _build/send_newsletter.py
      - name: Save the archive copy
        run: |
          git config user.name "lehco-site-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Weekly email issue"
            git pull --rebase
            git push
          fi
